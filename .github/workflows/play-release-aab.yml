name: HAKKIVEDA Play Store release AAB and test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check required signing and Firebase secrets
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          for name in GOOGLE_SERVICES_JSON_BASE64 ANDROID_UPLOAD_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required release credential: $name"
              exit 1
            fi
          done
      - name: Restore Firebase and upload key
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hakkiveda-upload.jks"
          chmod 600 "$RUNNER_TEMP/hakkiveda-upload.jks"
          python3 - <<'PY'
          import json
          with open('android/app/google-services.json') as f:
              cfg=json.load(f)
          packages=[c.get('client_info',{}).get('android_client_info',{}).get('package_name') for c in cfg.get('client',[])]
          assert 'com.hakkiveda.app' in packages, 'Firebase package name mismatch'
          PY
      - run: npm ci
      - run: npm run build
      - run: node tests/customer-orders.integration.mjs
      - run: node tests/orders-render.mjs
      - name: Sync Android app
        run: |
          rm -f dist/server.cjs dist/server.cjs.map
          npx cap sync android
      - name: Build signed Play release bundle
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/hakkiveda-upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          bash gradlew --no-daemon bundleRelease assembleRelease
          test -s app/build/outputs/bundle/release/app-release.aab
          test -s app/build/outputs/apk/release/app-release.apk
      - name: Verify release APK signature
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk
      - name: Verify release bundle signature and contents
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/hakkiveda-upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        run: |
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab
          keytool -list -v -keystore "$KEYSTORE_PATH" -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" | grep -E 'SHA1:|SHA256:'
          python3 - <<'PY'
          import zipfile
          bundle='android/app/build/outputs/bundle/release/app-release.aab'
          with zipfile.ZipFile(bundle) as z:
              scripts=b'\n'.join(z.read(n) for n in z.namelist() if n.startswith('base/assets/public/assets/') and n.endswith('.js'))
              for marker in [b'Hair & Scalp Care Quiz',b'Search by product or Order ID',b'Refresh orders',b'Buy Again']:
                  assert marker in scripts, f'Release bundle missing: {marker!r}'
              assert not any(n.endswith('server.cjs') or n.endswith('server.cjs.map') for n in z.namelist())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hakkiveda-play-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: hakkiveda-signed-release-apk-for-phone
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
